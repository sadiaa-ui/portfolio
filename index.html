<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My E-Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3d3;--ink:#54423a;--tan:#b89d85;--brown:#8c6a58;--onink:#efe3d3;color-scheme:light}


:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Poppins,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:800;text-transform:uppercase;line-height:1.1}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px;position:relative}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:0;background:var(--brown);z-index:20}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.logo{font-weight:700;text-decoration:none;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.links{display:flex;gap:18px;overflow-x:auto;font-size:13px;font-weight:500}
.links a{text-decoration:none;white-space:nowrap;opacity:.75}.links a:hover{opacity:1;color:var(--brown)}
.theme{background:none;border:1.5px solid var(--tan);color:var(--ink);border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.pill{display:inline-block;background:var(--ink);color:var(--onink);padding:9px 26px;border-radius:999px;font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.handle{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
section{padding:70px 0;position:relative}
h2{font-size:clamp(28px,5vw,40px);margin-bottom:22px}
p{margin:0 0 14px}
.frame{border:6px solid var(--tan);overflow:hidden;background:var(--tan)}
.frame img{object-position:50% 20%}
.frame img,.ph{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.ph{font:800 90px Poppins;color:var(--bg);background:linear-gradient(135deg,var(--tan),var(--brown))}
.arch{position:absolute;width:100px;height:160px;border-radius:100px 100px 0 0;--c:var(--tan);box-shadow:inset 0 0 0 2px var(--c),inset 0 0 0 10px var(--bg),inset 0 0 0 12px var(--c),inset 0 0 0 20px var(--bg),inset 0 0 0 22px var(--c),inset 0 0 0 30px var(--bg),inset 0 0 0 32px var(--c);pointer-events:none;will-change:transform}
.dots{position:absolute;width:110px;height:34px;background:radial-gradient(var(--brown) 1.6px,transparent 2px) 0 0/9px 9px;pointer-events:none}
.blob{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
/* hero */
.hero{padding:50px 0 80px;overflow:hidden}
.hero .wrap{display:grid;gap:40px;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.2fr 1fr}}
.hero h1{font-size:clamp(46px,10vw,92px);margin:14px 0 22px}
.hero .shot{position:relative;justify-self:center;width:min(360px,80%);aspect-ratio:3/4}
.hero .shot::before{content:"";position:absolute;inset:-20px -40px -20px 30%;background:var(--ink);z-index:0}
.hero .shot .frame{position:relative;z-index:1;height:100%}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{padding:10px 24px;border-radius:999px;border:2px solid var(--ink);text-decoration:none;font-weight:600;font-size:14px;text-transform:uppercase;transition:.2s}
.btn:hover{background:var(--ink);color:var(--onink);transform:translateY(-3px)}
/* about */
.two{display:grid;gap:36px;align-items:center}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr}.two.rev .media{order:2}}
.circle{border-radius:50%;aspect-ratio:1;width:min(340px,80%);justify-self:center}
.round{border-radius:36px;aspect-ratio:1;width:min(340px,80%);justify-self:center}
.edu{padding-left:20px;border-left:3px solid var(--tan)}
.edu .pill{font-size:13px;padding:4px 18px}
.edu h3{font-size:18px;line-height:1.25;margin:14px 0 10px}
.edu .chips{margin:0 0 12px}
.edu p{margin:0}
.dec{position:relative;width:min(340px,80%);margin:0 auto}
.dec .round{width:100%}
.dec .frame{position:relative;z-index:1}
.dec .dots{width:120px;height:120px;background-size:13px 13px;z-index:0}
.dec .d1{left:-34px;top:-30px}
.dec .d2{right:-34px;bottom:-30px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--tan);padding:3px 14px;border-radius:999px;font-size:13px;font-weight:500}
.item{margin-bottom:26px}.item h3{font-size:18px;margin:12px 0 8px}
.cols{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols h2{text-align:center}
.cols .item{text-align:left}
.center{text-align:center}
.band{height:280px;margin-top:50px;border-width:6px 0 0;width:100vw;margin-left:calc(50% - 50vw);position:relative}
.band div{width:100%;height:100%;background:linear-gradient(120deg,var(--brown),var(--tan) 55%,var(--ink));opacity:.9}
.info{display:grid;gap:22px 40px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.info b{display:block;font-weight:700;text-transform:uppercase;font-size:14px}
.info a,.info span{text-transform:uppercase;font-size:15px;word-break:break-word}
.thanks{text-align:center;padding:90px 0 60px}
.thanks h2{font-size:clamp(44px,12vw,100px)}
footer{padding:0 0 30px;text-align:center}
/* scroll effects */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.l{transform:translateX(-50px)}.rv.r{transform:translateX(50px)}.rv.z{transform:scale(.85)}
.rv.in{opacity:1;transform:none}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.w>i{display:inline-block;font-style:normal;transform:translateY(110%);transition:transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.in .w>i,.w.in>i{transform:none}
@media(prefers-reduced-motion:reduce){.rv,.w>i{transition:none;opacity:1;transform:none}}
</style></head><body>
<div id="bar"></div>
<nav><div class="wrap"><a class="logo" href="#top" id="logo"></a>
<div class="links"><a href="#about">About me</a><a href="#education">Education</a><a href="#hobbies">Hobbies</a><a href="#contact">Contact</a></div>
</div></nav>

<header class="hero" id="top"><div class="arch" data-p=".12" style="left:48%;top:-30px"></div><div class="blob" data-p="-.08" style="width:150px;height:150px;background:var(--tan);right:-30px;bottom:20px"></div><div class="blob" data-p="-.14" style="width:110px;height:110px;background:var(--brown);right:60px;bottom:-30px;opacity:.8"></div>
<div class="wrap"><div><span class="handle rv" id="year"></span><h1 id="heroName" class="split"></h1><span class="pill rv" style="--d:.4s" id="tagline"></span>
<div class="btns rv" style="--d:.7s"><a class="btn" id="resume" target="_blank" rel="noopener">Resume</a><a class="btn" id="experience" target="_blank" rel="noopener">Campus life</a></div></div>
<div class="shot rv r"><div class="frame" id="photo1"></div></div></div></header>

<section id="about"><div class="dots" data-p=".05" style="right:6%;top:30px"></div><div class="wrap">
<div style="max-width:640px"><h2 class="split">A little about me</h2><div class="rv" id="about1"></div><div class="chips rv" id="interests"></div></div></div></section>

<section id="education"><div class="arch" data-p=".1" style="left:46%;top:-20px"></div><div class="wrap two rev"><div class="media rv l"><div class="dec"><div class="dots d1"></div><div class="dots d2"></div><div class="frame round" id="photo3"></div></div></div>
<div><h2 class="split">Education</h2><div id="edu"></div></div></div></section>

<section id="hobbies"><div class="dots" data-p=".05" style="right:6%;top:30px"></div><div class="wrap"><h2 class="split">Hobbies</h2><div class="cols" id="skillGrid"></div></div></section>

<section id="contact"><div class="arch" data-p=".1" style="left:8%;bottom:-40px"></div><div class="wrap"><h2 class="split">Get in touch</h2><h3 class="rv" style="font-size:18px;margin-bottom:22px">Let's collaborate!</h3><div class="info" id="info"></div></div></section>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=(u,n)=>u?'<img src="'+esc(u)+'" alt="'+esc(n)+'">':'<div class="ph">'+esc(ME.name.charAt(0).toUpperCase())+'</div>';
document.title=ME.name+" | E-Portfolio";
$("logo").textContent=ME.name;$("year").textContent=new Date().getFullYear();
$("heroName").textContent=ME.name;$("tagline").textContent=ME.tagline;
$("about1").innerHTML=ME.about.split("\n\n").map(t=>"<p>"+esc(t)+"</p>").join("");if(ME.resume)$("resume").href=ME.resume;if(ME.experience)$("experience").href=ME.experience;
$("photo1").innerHTML=img(ME.photo,ME.name);$("photo3").innerHTML=img(ME.photo3||ME.photo,ME.name);
$("interests").innerHTML=ME.interests.map(i=>'<span class="chip">'+esc(i)+'</span>').join("");
const it=(a,k)=>a.map((x,i)=>'<div class="item rv" style="--d:'+i*.12+'s"><span class="pill">'+esc(x.title)+'</span>'+(x.desc?'<p style="margin-top:14px">'+esc(x.desc)+'</p>':'')+'</div>').join("");
$("edu").innerHTML=ME.education.map((x,i)=>'<div class="item edu rv" style="--d:'+i*.12+'s"><span class="pill">'+esc(x.years)+'</span><h3>'+esc(x.title)+'</h3>'+(x.chips?'<div class="chips">'+x.chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join("")+'</div>':"")+(x.desc?'<p>'+esc(x.desc)+'</p>':"")+'</div>').join("");$("skillGrid").innerHTML=it(ME.hobbies);
const links=[["Linkedin",ME.linkedin],["Instagram",ME.instagram],["GitHub",ME.github]].filter(l=>l[1]).map(l=>'<a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+l[0]+'</a>').join(" · ");
const inf=[["Phone",ME.phone],["Email",ME.email,"mailto:"+ME.email],["Website",ME.website,ME.website],["Address",ME.address],["Social",links,1]].filter(x=>x[1]);
$("info").innerHTML=inf.map((x,i)=>'<div class="rv" style="--d:'+i*.1+'s"><b>'+x[0]+'</b>'+(x[2]===1?x[1]:x[2]?'<a href="'+esc(x[2])+'">'+esc(x[1])+'</a>':'<span>'+esc(x[1])+'</span>')+'</div>').join("");

/* word-by-word headline reveal */
document.querySelectorAll(".split").forEach(h=>{h.innerHTML=h.textContent.split(" ").map((w,i)=>'<span class="w" style="--d:'+i*.1+'s"><i>'+esc(w)+'</i></span>').join(" ")});
/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll(".rv,.split").forEach(el=>io.observe(el));
/* parallax decorations + progress bar */
const par=[...document.querySelectorAll("[data-p]")],bar=$("bar");
let t=false;const tick=()=>{t=false;const y=scrollY;par.forEach(p=>p.style.transform="translateY("+(y*p.dataset.p).toFixed(1)+"px)");bar.style.width=(y/(document.documentElement.scrollHeight-innerHeight)*100)+"%"};
addEventListener("scroll",()=>{if(!t){t=true;requestAnimationFrame(tick)}},{passive:true});tick();
